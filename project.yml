name: Halo
options:
  bundleIdPrefix: dk.patrickjak.halo
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    # Sparkle compares build numbers, so they go up with the version.
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
    # Every target must be signed by a real team: macOS keys Local Network permission to the
    # code signature, and an ad-hoc signed helper is refused Bonjour (-65555 NoAuth).
    DEVELOPMENT_TEAM: 537P4FPMZ4
    CODE_SIGN_STYLE: Automatic

packages:
  HaloKit:
    path: Packages/HaloKit
  # Updates for the Mac helper: finds new releases on GitHub and installs them.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0

targets:
  HaloPad:
    type: application
    platform: iOS
    sources:
      - Apps/HaloPad/Sources
      - Apps/HaloPad/Resources/Assets.xcassets
    dependencies:
      - package: HaloKit
        product: HaloCore
      - package: HaloKit
        product: HaloProtocol
      - package: HaloKit
        product: HaloTransport
      - package: HaloKit
        product: HaloTrackpad
      - package: HaloKit
        product: HaloDashboard
    info:
      path: Apps/HaloPad/Resources/Info.plist
      properties:
        CFBundleDisplayName: Halo
        UILaunchScreen: {}
        # Mostly landscape on a desk, but iPadOS 26 resizes apps freely, so the grid adapts to any shape.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Halo connects to the Halo helper on your Mac over the local network.
        NSBonjourServices:
          - _halo._tcp
          - _halo-pair._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.patrickjak.halo.pad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Halo
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: true

  HaloMac:
    type: application
    platform: macOS
    sources:
      - Apps/HaloMac/Sources
      - Apps/HaloMac/Resources/Assets.xcassets
    dependencies:
      - package: HaloKit
        product: HaloCore
      - package: HaloKit
        product: HaloProtocol
      - package: HaloKit
        product: HaloAgents
      - package: HaloKit
        product: HaloHookBridge
      - package: HaloKit
        product: HaloTransport
      - package: HaloKit
        product: HaloMetrics
      - package: HaloKit
        product: HaloInput
      - package: HaloKit
        product: HaloDesktop
      - package: Sparkle
      # Ships at Contents/MacOS/halo-hook, next to the helper's own executable.
      - target: HaloHook
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Apps/HaloMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: Halo Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 Patrick Jakobsen. MIT License.
        # Where Sparkle looks for new versions: the appcast attached to the latest GitHub release.
        SUFeedURL: https://github.com/Pallepadehat/Halo/releases/latest/download/appcast.xml
        # The public half of the key releases are signed with (the private half is in the maintainer's keychain).
        SUPublicEDKey: mHeNSUPTLt12nikqiH5D0uBl7MAlnOd8ZaennsPfpLo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        NSAppleEventsUsageDescription: Halo shows what Music and Spotify are playing on your iPad and lets you control them from there.
        NSCalendarsFullAccessUsageDescription: Halo shows your next event beside the clock on your iPad.
        NSLocalNetworkUsageDescription: Halo Helper talks to your paired iPad over the local network.
        NSBonjourServices:
          - _halo._tcp
          - _halo-pair._tcp
    # Declared here, not in the file: xcodegen regenerates the file from these on every run.
    # Hardened Runtime exceptions only; the helper is never sandboxed (see below).
    entitlements:
      path: Apps/HaloMac/Resources/HaloMac.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.patrickjak.halo.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Halo Helper
        ENABLE_HARDENED_RUNTIME: true
        # Never sandboxed, and don't add App Sandbox under Signing & Capabilities: it blocks
        # Bonjour (-65555 NoAuth), input posting, process sampling and agent hook installation.
        # Halo.xcodeproj is generated from this file, so edits made in Xcode are lost anyway.
        # Ships as a notarised direct download, never through the Mac App Store.
        ENABLE_APP_SANDBOX: false
        GENERATE_INFOPLIST_FILE: true
      configs:
        # Debug builds install to ~/Applications. mDNSResponder only trusts NSBonjourServices
        # from apps in a standard location; run from DerivedData, Bonjour fails with NoAuth.
        Debug:
          DEPLOYMENT_LOCATION: true
          DSTROOT: $(HOME)/Applications
          INSTALL_PATH: /
          SKIP_INSTALL: false

  HaloPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Apps/HaloPadUITests
    dependencies:
      - target: HaloPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.patrickjak.halo.pad.uitests
        TEST_TARGET_NAME: HaloPad
        GENERATE_INFOPLIST_FILE: true

  HaloHook:
    type: tool
    platform: macOS
    sources:
      - Apps/HaloHook/Sources
    dependencies:
      - package: HaloKit
        product: HaloCore
      - package: HaloKit
        product: HaloHookBridge
    settings:
      base:
        PRODUCT_NAME: halo-hook
        PRODUCT_BUNDLE_IDENTIFIER: dk.patrickjak.halo.hook
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true

schemes:
  HaloPad:
    build:
      targets:
        HaloPad: all
    test:
      targets:
        - HaloPadUITests
        - package: HaloKit/HaloCoreTests
        - package: HaloKit/HaloProtocolTests
        - package: HaloKit/HaloTrackpadTests
        - package: HaloKit/HaloDashboardTests
  HaloMac:
    build:
      targets:
        HaloMac: all
    test:
      targets:
        - package: HaloKit/HaloHookBridgeTests
        - package: HaloKit/HaloAgentsTests
        - package: HaloKit/HaloMetricsTests
        - package: HaloKit/HaloInputTests
        - package: HaloKit/HaloDesktopTests
